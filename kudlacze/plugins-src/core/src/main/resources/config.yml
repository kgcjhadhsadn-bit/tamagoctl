# =====================================================================
#  Kudłacze — plugin core (config.yml)
#  Ten plik jest domyślny (z jara). Konfiguracja serwerów sieci leży w repozytorium:
#  servers/<serwer>/plugins/KudlaczeCore/config.yml
# =====================================================================

# Nazwa serwera w sieci (lobby / survival / seasons) — obraz dockera podstawia ${CFG_SERVER_NAME}
serwer: ${CFG_SERVER_NAME}
strefa-czasowa: Europe/Warsaw
domena: ${CFG_SERVER_DOMAIN}
discord-zaproszenie: ${CFG_DISCORD_INVITE}

baza:
  host: ${CFG_DB_HOST}
  port: ${CFG_DB_PORT}
  nazwa: ${CFG_DB_NAME}
  uzytkownik: ${CFG_DB_USER}
  haslo: ${CFG_DB_PASSWORD}
  pula: 6
  watki: 4

moduly:
  waluta: true
  rangi: true
  smierc: false
  perki: true
  czat: true
  drwal: false
  strefa-vip: false
  lobby: false
  bootstrap: true
  siec: true
  info: true
  tytuly: true
  ranking: true
  sezony: false
  smok: false
  edycje: false
  afk: false
  konkurs: false
  parkour: false
  sklep: false
  logi-kar: false
  restart: false

waluta:
  # sekret HMAC przedmiotów KC — ten sam na wszystkich serwerach (KC_ITEM_SECRET w .env)
  sekret-przedmiotow: ${CFG_KC_ITEM_SECRET}

smierc:
  # KICK | KICK_AND_LOCK | DISABLED
  tryb: KICK
  blokada-minut: 5
  # światy bez kicka po śmierci (arena Smoka Kudłatego)
  swiaty-bez-kicka: []

perki:
  piec-cooldown-sekund: 10

czat:
  format: '<tytul><prefiks><nick><sufiks><dark_gray> » </dark_gray><wiadomosc>'
  powtorzenie-sekund: 5
  # domeny, które wolno pisać na czacie (poza domeną serwera)
  dozwolone-domeny:
    - discord.gg
    - youtube.com
    - youtu.be

drwal:
  limit-blokow: 96
  minimum-lisci: 4
  kucanie-wylacza: true
  siekiera-netherytowa: false
  siekiery: [WOODEN_AXE, STONE_AXE, COPPER_AXE, IRON_AXE, GOLDEN_AXE, DIAMOND_AXE]

# Skarbnik (strefa VIP). Oczekiwanie: ~0,7 KC dziennie ≈ 5 KC tygodniowo (docs/EKONOMIA.md).
nagroda-codzienna:
  nagrody:
    - {waga: 50, kc: 1, opis: '<light_purple>1 Kłak Czarodzieja'}
    - {waga: 10, kc: 2, opis: '<light_purple>2 Kłaki Czarodzieja'}
    - {waga: 25, pieniadze: 250, opis: '<green>250 zł'}
    - {waga: 15, przedmioty: ['GOLDEN_APPLE:2', 'EXPERIENCE_BOTTLE:16'], opis: '<gold>2 złote jabłka i 16 butelek doświadczenia'}

expiarka:
  co-ile-sekund: 4
  max-mobow: 6
  promien-gracza: 10
  xp-za-moba: 5

lobby:
  spawn: {x: 0.5, y: -60.0, z: 0.5, yaw: 0.0, pitch: 0.0}
  pustka-y: -70

bootstrap:
  buduj-spawn: false
  ochrona-spawnu-promien: 150

siec:
  serwery: [lobby, survival, seasons]

yt:
  cooldown-minut: 30

# Kanały Discorda (ID z .env) dla ogłoszeń przez DiscordSRV (discordsrv bcast). Zera = wyłączone.
discord:
  kanaly:
    smok: ${CFG_DISCORD_CHANNEL_SMOK}
    ranking: ${CFG_DISCORD_CHANNEL_RANKING}
    czat-survival: ${CFG_DISCORD_CHANNEL_CZAT_SURVIVAL}
    czat-seasons: ${CFG_DISCORD_CHANNEL_CZAT_SEASONS}
    logi-kar: ${CFG_DISCORD_CHANNEL_LOGI_KAR}

# Ranking sezonu (placeholdery %kudlacze_top_<n>_nick%, hologram w lobby, /ranking)
ranking:
  rozmiar: 10
  odswiezanie-sekund: 30

# Seasons: reset 1. dnia miesiąca o 12:00 (strefa-czasowa), nagrody top 3: KC + tytuł
sezon:
  reset:
    dzien: 1
    godzina: '12:00'
  nagrody-kc: [50, 30, 20]
  tytuly: [mistrz-sezonu, wicemistrz-sezonu, brazowy-sezonu]
  archiwum-miejsc: 10
  ostrzezenia-minut: [1440, 60, 10, 1]
  afk-po-minutach: 5
  archiwizuj-swiat: false
  dodatkowe-swiaty: []

# Smok Kudłaty: co tydzień, arena w osobnym świecie THE_END
smok:
  swiat: seasons_boss
  dzien: SUNDAY
  godzina: '20:00'
  ogloszenie-minut-przed: 30
  arena-otwarta-minut-przed: 15
  czekaj-na-graczy-minut: 10
  limit-minut: 30
  zdrowie: 400
  min-obrazen: 10
  punkty: [100, 80, 60, 40, 20]
  kc: [10, 8, 6, 4, 2]
  tytul: smokobojca
  tytul-miejsc: 5
  pvp: false
  granica: 400
  arena: {x: 0.5, z: 60.5}

# Edycje survivalu (co ok. 3 miesiące, /edycja nowa)
edycja:
  dlugosc-dni: 90
  wygas-rangi: true
  archiwizuj-swiat: true
  konkurs-dni: 14
  dodatkowe-swiaty: []
  end:
    auto-otwarcie-dni: 7
    godzina: '20:00'

# Czyszczenie logów bloków CoreProtect starego świata przy resecie (prefiks tabel serwera, puste = nie)
reset:
  coreprotect-prefiks: ''

# Anty-AFK: AFK = brak ruchu kamery, czatu i nieregularnych kliknięć. AFK nie dostaje nagród za czas gry.
afk:
  po-minutach: 5
  kick-po-minutach: 15
  ostrzezenie-sekund: 60
  # autoklikacz: stały rytm ataków (współczynnik zmienności odstępów < makro-cv na ostatnich N kliknięciach)
  okno-klikniec: 20
  makro-cv: 0.03

# Kudłate Chaty (survival): zgłoszenia w ostatnich edycja.konkurs-dni dniach edycji
konkurs:
  wymagaj-dzialki: true
  nagrody-kc: [60, 40, 20]
  tytuly: [mistrz-chat, architekt, budowniczy]

# Codzienny restart (kontener wstaje sam — restart: unless-stopped); backup hosta o 04:00
restart:
  godzina: '05:00'
  ostrzezenia-minut: [15, 5, 1]

# Parkour w lobby (trasę buduje bootstrap.txt lobby — współrzędne muszą się zgadzać)
parkour:
  swiat: world
  posadzka-y: -60
  start: {x: 12, y: -60, z: 0}
  punkty-kontrolne:
    - {x: 20, y: -56, z: -1}
  meta: {x: 28, y: -52, z: 0}

# Sklep kosmetyczny — WYŁĄCZONY. Dozwolone typy: TYTUL, KOLOR_NICKU, CZASTECZKI (walidacja w pluginie).
# Wszystko, co daje przewagę (rangi, KC, przedmioty), zdobywa się wyłącznie w grze (EULA).
sklep:
  wlaczony: false
  pozycje: {}

# Logi kar LibertyBans → Discord #logi-kar (włączać na jednym serwerze z DiscordSRV)
logi-kar:
  co-ile-sekund: 15

