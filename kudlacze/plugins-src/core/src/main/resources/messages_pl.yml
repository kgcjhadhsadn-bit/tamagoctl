  historia-naglowek: '<prefix><gray>Ostatnie transakcje KC gracza <white><gracz></white>:'
  historia-pusta: '<gray>  (brak transakcji)'
  historia-wpis: '<dark_gray>  <czas></dark_gray> <zmiana> <gray>→ saldo <white><saldo></white> <dark_gray>(<typ>)'
  uzycie-admin: '<prefix><gray>Użycie: <yellow>/kc daj|zabierz|ustaw <nick> <ilość>'
