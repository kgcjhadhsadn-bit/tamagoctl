    - '<yellow>/kc przelej <nick> <ilość></yellow> <gray>— przelew do gracza'
    - '<yellow>/kc historia</yellow> <gray>— ostatnie transakcje'
    - '<yellow>/wyplac <ilość></yellow> <gray>— wypłać jako przedmioty (do handlu)'
    - '<yellow>/wplac</yellow> <gray>— wpłać przedmioty z ekwipunku'
    - '<yellow>/rangi</yellow> <gray>— wymień KC na rangę u Czarodzieja Kudłacza'
