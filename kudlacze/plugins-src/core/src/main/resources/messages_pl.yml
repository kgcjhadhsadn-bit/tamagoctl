  ogloszenie: '<prefix><red>▶</red> <white><gracz></white> <gray>zaprasza na swój kanał: <link>'

regulamin:
  - '<gradient:#c77dff:#7b2cbf><bold>Regulamin Kudłaczy</bold></gradient>'
  - '<white>1.</white> <gray>Poza działkami survival jest brutalny: wolno walczyć, kraść i oszukiwać.'
  - '<white>2.</white> <red>Griefowanie cudzych działek jest zakazane</red> <gray>(kary do bana).'
  - '<white>3.</white> <gray>Zakaz cheatów, modów dających przewagę, bugowania i wykorzystywania błędów.'
  - '<white>4.</white> <gray>Zakaz farm AFK (tzw. afkczarek) — gracz AFK nie zdobywa nagród i jest wyrzucany.'
  - '<white>5.</white> <gray>Zakaz reklamy innych serwerów, spamu, floodu i pisania CAPSEM.'
  - '<white>6.</white> <gray>Zakaz handlu przedmiotami, walutą i kontami za prawdziwe pieniądze.'
  - '<white>7.</white> <gray>Szanuj innych graczy i administrację — bez obrażania i dyskryminacji.'
  - '<white>8.</white> <gray>Śmierć = wyrzucenie z serwera (na survivalu blokada 5 min, od UVIP bez blokady).'
  - '<dark_gray>Pełna treść: docs/REGULAMIN.md • nieznajomość regulaminu nie zwalnia z jego przestrzegania.'
