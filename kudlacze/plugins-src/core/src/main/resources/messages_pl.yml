# =====================================================================
#  Kudłacze — teksty pluginu core (MiniMessage: https://docs.advntr.dev/minimessage/format)
#  Znaczniki w <nawiasach> jak <gracz>, <ilosc> są podstawiane przez plugin.
#  <prefix> wstawia prefiks poniżej.
# =====================================================================
prefix: '<gradient:#c77dff:#7b2cbf><bold>Kudłacze</bold></gradient> <dark_gray>»</dark_gray> '

blad-wewnetrzny: '<prefix><red>Coś poszło nie tak. Spróbuj ponownie za chwilę, a jeśli błąd się powtarza — zgłoś to administracji.'
tylko-gracz: '<prefix><red>Tej komendy może użyć tylko gracz.'
brak-uprawnien: '<prefix><red>Nie masz uprawnień do tej komendy.'
zla-liczba: '<prefix><red>„<wartosc>” nie jest poprawną liczbą.'
nie-znaleziono-gracza: '<prefix><red>Nie znaleziono gracza <white><gracz></white>.'

