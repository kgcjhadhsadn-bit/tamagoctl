  za-malo: '<prefix><red>Masz za mało Kłaków Czarodzieja <dark_gray>(saldo: <saldo> KC)</dark_gray>.'
  podrobka: '<prefix><red>Skonfiskowano <ilosc> podrobionych Kłaków! Administracja została powiadomiona.'
