# =====================================================================
#  Nadpisania do uruchomienia LOKALNEGO (laptop / CI).
#  docker compose wczytuje ten plik automatycznie. Na VPS ustaw w .env:
#      COMPOSE_FILE=docker-compose.yml
#  żeby obowiązywały pełne limity z docker-compose.yml.
# =====================================================================
services:
  mariadb:
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
      - --default-time-zone=+00:00
    mem_limit: 512m

  # sterta + ~0.5-0.8 GB pamięci poza stertą (inaczej cgroup zabija JVM z exitCode -1)
  velocity:
    environment:
      MEMORY: 384m
    mem_limit: 900m

  lobby:
    environment:
      MEMORY: 768M
    mem_limit: 1600m

  survival:
    environment:
      MEMORY: 1536M
    mem_limit: 2400m

  seasons:
    environment:
      MEMORY: 1G
    mem_limit: 1800m
