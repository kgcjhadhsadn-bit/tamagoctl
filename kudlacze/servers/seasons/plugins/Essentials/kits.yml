# Kudłacze — zestawy (EssentialsX). Uprawnienie: essentials.kits.<nazwa>
# Wszystkie zestawy są zdobywane w grze (ranga VIP kupowana za Kłaki Czarodzieja) — zgodne z EULA.
# delay w sekundach; -1 = jednorazowy.
kits:
  start:
    delay: -1
    items:
      - stone_sword 1 name:&7Miecz_nowego_Kudłacza
      - stone_pickaxe 1
      - stone_axe 1
      - stone_shovel 1
      - bread 16
      - torch 16
      - /tellraw {USERNAME} {"text":"Witaj na Kudłaczach! Postaw kamień działki (/ps), by ochronić swój dom.","color":"light_purple"}
  jedzenie:
    delay: 3600
    items:
      - bread 16
      - cooked_beef 8
  vip:
    delay: 86400
    items:
      - iron_pickaxe 1 efficiency:2 unbreaking:1
      - iron_axe 1 efficiency:1
      - iron_shovel 1
      - cooked_beef 32
      - torch 32
      - oak_log 32
