# Kudłacze core — SEASONS (brakujące klucze z domyślnego config.yml w jarze)
serwer: ${CFG_SERVER_NAME}
strefa-czasowa: Europe/Warsaw
domena: ${CFG_SERVER_DOMAIN}
discord-zaproszenie: ${CFG_DISCORD_INVITE}

baza:
  host: ${CFG_DB_HOST}
  port: ${CFG_DB_PORT}
  nazwa: ${CFG_DB_NAME}
  uzytkownik: ${CFG_DB_USER}
  haslo: ${CFG_DB_PASSWORD}
  pula: 6
  watki: 4

waluta:
  sekret-przedmiotow: ${CFG_KC_ITEM_SECRET}

moduly:
  waluta: true
  rangi: true
  smierc: true
  perki: true
  czat: true
  drwal: true
  strefa-vip: true
  lobby: false
  bootstrap: true
  siec: true
  info: true
  tytuly: true
  ranking: true
  sezony: true
  smok: true
  edycje: false
  afk: true
  konkurs: false
  parkour: false
  sklep: true
  logi-kar: false
  restart: true

# Seasons: sam kick po śmierci (bez blokady)
smierc:
  tryb: KICK
  # arena Smoka Kudłatego: śmierć bez kicka (ekwipunek zostaje — keep_inventory w świecie areny)
  swiaty-bez-kicka: [seasons_boss]

bootstrap:
  buduj-spawn: true
  ochrona-spawnu-promien: 100

# Reset sezonu: czyszczenie logów bloków CoreProtect starego świata (tabele co_seasons_*)
reset:
  coreprotect-prefiks: co_seasons_
