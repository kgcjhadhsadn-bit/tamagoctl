# Kudłacze — lobby (Paper 26.2). Plik z repo synchronizowany do /data przy starcie kontenera.
# Autoryzację graczy robi Velocity (online-mode=true na proxy), dlatego tutaj online-mode=false
# i Paper przyjmuje połączenia wyłącznie z Velocity (modern forwarding, paper-global.yml).
server-port=25565
online-mode=false
enforce-secure-profile=false
prevent-proxy-connections=false
motd=Kudłacze — lobby
max-players=150
view-distance=6
simulation-distance=4
gamemode=adventure
force-gamemode=true
difficulty=peaceful
hardcore=false
level-name=world
level-seed=
spawn-protection=0
enable-command-block=false
white-list=false
enforce-whitelist=false
enable-query=false
enable-status=true
hide-online-players=false
network-compression-threshold=256
sync-chunk-writes=false
entity-broadcast-range-percentage=100
player-idle-timeout=0
enable-rcon=true
rcon.port=25575
rcon.password=${CFG_RCON_PASSWORD}
broadcast-rcon-to-ops=false
broadcast-console-to-ops=false
require-resource-pack=false
resource-pack=${CFG_RESOURCE_PACK_URL}
resource-pack-sha1=${CFG_RESOURCE_PACK_SHA1}
resource-pack-prompt={"text":"Paczka zasobów Kudłaczy (wygląd Kłaków Czarodzieja)","color":"light_purple"}
level-type=minecraft\:flat
generator-settings={"biome"\:"minecraft\:plains","layers"\:[{"block"\:"minecraft\:bedrock","height"\:1},{"block"\:"minecraft\:dirt","height"\:2},{"block"\:"minecraft\:grass_block","height"\:1}],"features"\:false,"lakes"\:false,"structure_overrides"\:[]}
generate-structures=false
allow-flight=true
