# =====================================================================
#  Kudłacze — plugins.lock.yml
#  Przypięte wersje serwera, proxy i wszystkich pluginów z sumami SHA256.
#
#  Pobieranie:   ./scripts/download-plugins.sh   (weryfikuje każdą sumę; niezgodność = błąd)
#  Aktualizacja: ./scripts/update-lock.sh         (podgląd nowych wersji z API)
#                ./scripts/update-lock.sh --apply (zapis nowych wersji/URL/SHA256)
#
#  Pola wpisu:
#    source   papermc | modrinth | hangar | github | geysermc | url
#    project  identyfikator projektu w danym źródle (slug / owner/repo)
#    platform loader/platforma (paper, velocity, spigot…), asset = regex nazwy pliku
#    targets  gdzie trafia jar: server-jar, proxy-jar, proxy, common (wszystkie backendy),
#             lobby, survival, seasons
#  Pola version/url/sha256 wypełnia update-lock — nie edytuj ich ręcznie.
# =====================================================================

